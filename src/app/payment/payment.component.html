<div class="booking-payment-container">
  <div class="payment-card">
    <h2 class="title">Booking Payment</h2>

    <form [formGroup]="paymentForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" formControlName="fullName" placeholder="Enter your name">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label>Amount (₹)</label>
        <input type="number" formControlName="amount" placeholder="Enter amount">
      </div>

      <div class="card-details">
        <div class="form-group">
          <label>Card Number</label>
          <input type="text" formControlName="cardNumber" maxlength="16" placeholder="xxxx xxxx xxxx xxxx">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Expiry</label>
            <input type="text" formControlName="expiry" maxlength="5" placeholder="MM/YY">
          </div>
          <div class="form-group">
            <label>CVV</label>
            <input type="password" formControlName="cvv" maxlength="3" placeholder="•••">
          </div>
        </div>
      </div>

      <button class="pay-btn" type="submit" [disabled]="!paymentForm.valid">Pay Now</button>
    </form>
  </div>
</div>
